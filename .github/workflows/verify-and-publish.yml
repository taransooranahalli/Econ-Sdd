name: Verify and publish showcase

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the pinned toolchain
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check tracked files before publication
        run: python tools/check_publication.py
      - name: Verify Python, JavaScript and dependencies
        run: |
          python -m pytest --junitxml=work/test-results.xml
          python -m compileall -q src tests tools
          python -m pip check
          node --check src/econ_sdd/static/app.js
          node --check src/econ_sdd/static/cash-flow.js
          node --check src/econ_sdd/static/investments.js
          node --check src/econ_sdd/static/account.js
          node --check src/econ_sdd/static/stocks.js
          node --check site/assets/showcase.js
      - name: Build the public asset allowlist
        env:
          REPOSITORY: ${{ github.repository }}
        run: python tools/build_showcase.py --repository "$REPOSITORY" --test-report work/test-results.xml
      - name: Upload the static showcase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/showcase

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the verified showcase
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
