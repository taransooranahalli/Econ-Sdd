[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-sdd"
version = "0.4.0"
description = "Private local finance calculators with independently tested Decimal calculations"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=50,<51", "argon2-cffi>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2,<3"]

[project.scripts]
econ-sdd = "econ_sdd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
econ_sdd = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
